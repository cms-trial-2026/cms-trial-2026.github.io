# サイトをビルドして GitHub Pages に公開する（お試し版。scripts/export-trial.sh で書き出したリポジトリで使う）。
# main に入ったとき・1時間ごと（予約公開と公開終了のため）・手動のときに動く。
# ビルド（npm のコードが動く）と公開を別のジョブに分け、公開の権限は公開のジョブにだけ渡す。
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *' # 毎時7分（UTC）。混みやすい毎時0分を避ける。GitHub の都合で遅れたり抜けたりすることがある
  workflow_dispatch:

permissions: {}

# 実行を1本ずつに並べる。待っている実行は最新の1本に置き換わる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # github-pages 環境は main からの公開だけを受け付ける設定にするので、ほかのブランチでは動かさない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      # 古い実行が新しい版を上書きしないよう、きっかけのコミットではなく、その時点の main を取る
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          for f in dist/index.html dist/404.html dist/admin/index.html dist/admin/config.yml; do
            if [ ! -s "$f" ]; then echo "::error::$f is missing"; exit 1; fi
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # 今の main を確かめるため
      pages: write
      id-token: write # deploy-pages が公開の権限を確かめるため
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 失敗したジョブだけを後から再実行したとき、古い版で上書きしないため
      - name: Check that the build is the latest main
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_SHA: ${{ needs.build.outputs.sha }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$head" != "$BUILT_SHA" ]; then
            echo "::error::main は ${head} に進んでいます（ビルドは ${BUILT_SHA}）。新しい実行に任せます"; exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
